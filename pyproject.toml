[project]
name = "string-width-calculator"
version = "0.1.1"
description = "Determines terminal column width of text in monospace fonts, handling wide East Asian glyphs and invisible combining characters."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
